<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>zoci · lights</title>
<style>
  :root {
    --bg: #0e0f12; --panel: rgba(22,23,27,0.92); --gold: rgba(196,160,84,0.28);
    --gold-text: #c4a054; --text: #ececec; --muted: #9a9a9a; --maroon: #c62828; --hairline: rgba(255,255,255,0.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .wrap { max-width: 34rem; margin: 0 auto; padding: 2.2rem 1rem calc(4rem + env(safe-area-inset-bottom)); }
  header { margin-bottom: 1.4rem; }
  h1 { font-size: clamp(1.8rem, 7vw, 2.6rem); font-weight: 700; margin: 0 0 .2rem; letter-spacing: -0.01em; }
  h1 .accent { color: var(--maroon); }
  .sub { color: var(--muted); font-size: .88rem; }
  .room {
    background: var(--panel); border: 1px solid var(--gold);
    box-shadow: 0 10px 30px -16px rgba(0,0,0,0.75);
    border-radius: 12px; padding: .5rem 1.05rem; margin-bottom: 1rem;
  }
  .room h2 { font-size: .82rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--gold-text); margin: .8rem 0 .3rem; }
  .light { display: flex; align-items: center; justify-content: space-between; padding: .7rem 0; min-height: 44px; }
  .light + .light { border-top: 1px solid var(--hairline); }
  .light .name { font-size: .98rem; }
  .light.unavail .name { color: var(--muted); }
  .sw { position: relative; width: 52px; height: 30px; flex: none; }
  .sw input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .track { position: absolute; inset: 0; background: #3a3b40; border-radius: 999px; transition: background .18s ease; pointer-events: none; }
  .track::before { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px;
    background: #ececec; border-radius: 50%; transition: transform .18s ease; }
  .sw input:checked + .track { background: var(--maroon); }
  .sw input:checked + .track::before { transform: translateX(22px); }
  .sw input:disabled { cursor: default; }
  .sw input:disabled + .track { opacity: .4; }
  .foot { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 1.2rem; min-height: 1em; }
  .foot.err { color: #dc3535; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Guest <span class="accent">lights</span></h1>
    <div class="sub">Signed in as <b>__EMAIL__</b></div>
  </header>
  <div id="rooms"><div class="foot">Loading…</div></div>
  <div class="foot" id="foot"></div>
</div>
<script>
  const roomsEl = document.getElementById('rooms');
  const footEl = document.getElementById('foot');
  const busy = new Set();

  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function lightRow(l){
    const off = l.state === 'unavailable' || l.state === 'unknown';
    const on = l.state === 'on';
    return '<div class="light ' + (off ? 'unavail' : '') + '">' +
      '<span class="name">' + esc(l.label) + (off ? ' · offline' : '') + '</span>' +
      '<label class="sw"><input type="checkbox" data-key="' + esc(l.key) + '"' + (on ? ' checked' : '') + (off ? ' disabled' : '') + '><span class="track"></span></label>' +
      '</div>';
  }

  function render(rooms){
    roomsEl.innerHTML = rooms.map(r => '<div class="room"><h2>' + esc(r.room) + '</h2>' + r.lights.map(lightRow).join('') + '</div>').join('');
    roomsEl.querySelectorAll('input[data-key]').forEach(el => el.addEventListener('change', () => toggle(el.dataset.key, el)));
  }

  async function load(){
    try {
      const r = await fetch('/dashboard', { headers: { accept: 'application/json' } });
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      render(d.rooms || []);
      footEl.textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      footEl.classList.remove('err');
    } catch (e) {
      footEl.textContent = 'Connection issue — retrying…';
      footEl.classList.add('err');
    }
  }

  async function toggle(key, el){
    if (busy.has(key)) return;
    busy.add(key);
    const optimistic = el.checked;
    try {
      const r = await fetch('/toggle', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ key }) });
      const d = await r.json();
      if (d.state === 'on' || d.state === 'off') el.checked = d.state === 'on';
    } catch (e) {
      el.checked = !optimistic; // revert
    } finally {
      busy.delete(key);
    }
  }

  load();
  setInterval(() => { if (busy.size === 0) load(); }, 10000);
</script>
</body>
</html>
