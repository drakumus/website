<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-planet.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#131417" />
    <title>zoci.me</title>
    <!--
      Paint the dark base before any JS runs. The app's CSS is bundled into JS and
      injected at runtime, so without this the browser's first paint is default white
      (a flash on reload). color-scheme: dark keeps the scrollbar/UA controls dark too.
    -->
    <style>
      html {
        background-color: #131417;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
