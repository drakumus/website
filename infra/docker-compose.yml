# Bound container logs on every service (json-file, 3 × 10 MB max, ~30 MB ceiling each).
# Docker's default json-file driver has no rotation, so a chatty service (e.g. the guest
# dashboard's 10s poll through api + ha-broker + oauth2-proxy) would otherwise grow logs
# unbounded on the SSD. Referenced as `logging: *default-logging` on each service below.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    container_name: caddy      # stable name so acme.sh's reload (docker exec caddy) works
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    # host networking: binds :80/:443 on the host and reaches web/api/jellyfin via localhost.
    network_mode: host
    restart: unless-stopped
    logging: *default-logging
    environment:
      # ACME contact email, from infra/.env (gitignored). Empty is fine.
      - ACME_EMAIL=${ACME_EMAIL:-}
      - HA_ADDR=${HA_ADDR:-}     # ha.zoci.me reverse-proxies here (LAN)
      # VPS tailnet IP for (tailnet_guard); doc-range default (matches nothing) when unset.
      - VPS_TS_IP=${VPS_TS_IP:-198.51.100.0/32}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro         # acme.sh wildcard, loaded by every vhost (auto_https off)
      - ./audit/caddy:/var/log/caddy   # JSON access log for the audit processor (host-only, gitignored)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  web:
    build:
      context: ..
      dockerfile: app/Dockerfile
    image: zoci-web:latest
    restart: unless-stopped
    logging: *default-logging
    # loopback-only: reachable by Caddy (host) and the box, never the LAN/internet.
    ports:
      - "127.0.0.1:8080:80"
    # Hardening: read-only rootfs (nginx's writable paths go to tmpfs) + no privilege escalation.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    image: zoci-api:latest
    restart: unless-stopped
    logging: *default-logging
    networks:
      # broker: reaches ha-broker (control + its /metrics). apiscrape: a dedicated point-to-point
      # bridge shared ONLY with VictoriaMetrics, which scrapes api's :9101 metrics listener there.
      # api is deliberately kept OFF the shared `metrics` bridge: its :9102 admin-data listener
      # (verdict + access audit, both identity-bearing) binds 0.0.0.0, so any bridge peer could reach
      # it. Off `metrics`, Grafana and oauth2-proxy cannot; only VM (passive, never initiates to api)
      # and ha-broker share a bridge with :9102. api re-exposes ha-broker's metrics so VM never joins
      # the broker network.
      - broker
      - apiscrape
    ports:
      # main (public) app; and the admin data listener on loopback for Caddy's tailnet-gated admin
      # vhost. The :9101 metrics listener is never host-published (apiscrape network only).
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:9102:9102"
    environment:
      - STATUS_DIR=/status
    # Read-only mount of the host-written status files (verdict.json, health-dot.json, access.jsonl,
    # from write-verdict.py / write-access-audit.py). No Docker socket here: the internet-facing api
    # only reads plain files.
    volumes:
      - ./status:/status:ro
    # Hardening (matches ha-broker): non-root (Dockerfile USER node), read-only rootfs with a
    # tmpfs for tsx's transpile cache + tmp, and no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  coredns:
    # Split-DNS resolver for the tailnet-only names (secure-access.md §4). host networking
    # so it can bind the tailnet IP directly on :53. Needs HOME_TS_IP set in infra/.env
    # before deploy (an empty value makes CoreDNS fail to bind; it won't affect the other
    # services, but the container will restart-loop until HOME_TS_IP is set).
    image: coredns/coredns:1.14.6@sha256:900f9c109f7a33545d3c811516e8376df9019147b750f5ce3e254468769176ea
    network_mode: host
    restart: unless-stopped
    logging: *default-logging
    command: ["-conf", "/etc/coredns/Corefile"]
    environment:
      - HOME_TS_IP=${HOME_TS_IP}
    volumes:
      - ./coredns/Corefile:/etc/coredns/Corefile:ro

  ha-broker:
    # Minimal HA credential holder (secure-access.md §6). Standalone package; the ONLY
    # process that holds HA_TOKEN. No host port, reachable only by `api` on the internal
    # bridge. Needs HA_ADDR + HA_TOKEN in infra/.env to serve /dashboard (until then /health
    # is up and /dashboard reports unconfigured).
    build:
      context: ../ha-broker
      dockerfile: Dockerfile
    image: zoci-ha-broker:latest
    restart: unless-stopped
    logging: *default-logging
    networks:
      - broker
    environment:
      - HA_ADDR=${HA_ADDR:-}
      - HA_TOKEN=${HA_TOKEN:-}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  oauth2-proxy:
    # Guest login gate (secure-access.md §7.2). Google OIDC; Caddy calls it via forward_auth
    # and reverse_proxy /oauth2/*. Published on host loopback so only host-net Caddy reaches
    # it. Egress to Google is via the default bridge (not on the broker network). Distroless
    # image → no in-container healthcheck; verify via the host /ping.
    # Pinned by digest (v7.15.3). Upgraded from v7.7.1, which predated fixes for the
    # skip-auth-route and X-Forwarded-Uri auth-bypass classes (not exploitable here, since no
    # skip-auth routes are configured, but this is the sole identity gate, so keep it current).
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3@sha256:10a1165743a192e1940b4708fb9647027185ce11a681a1c5519b442ff7f1f561
    restart: unless-stopped
    logging: *default-logging
    # default: egress to Google + the loopback :4180 Caddy calls. metrics: VictoriaMetrics scrapes
    # the native metrics endpoint (:44180) here; that port is not host-published, so it stays off
    # the LAN and reaches only the metrics plane.
    networks:
      - default
      - metrics
    ports:
      - "127.0.0.1:4180:4180"
    environment:
      - OAUTH2_PROXY_METRICS_ADDRESS=0.0.0.0:44180
      - OAUTH2_PROXY_PROVIDER=google
      - OAUTH2_PROXY_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - OAUTH2_PROXY_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_PROXY_COOKIE_SECRET:-}
      - OAUTH2_PROXY_REDIRECT_URL=https://guest.zoci.me/oauth2/callback
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_REVERSE_PROXY=true
      - OAUTH2_PROXY_SET_XAUTHREQUEST=true
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE=/etc/oauth2-proxy/emails.txt
      - OAUTH2_PROXY_COOKIE_SECURE=true
      - OAUTH2_PROXY_COOKIE_SAMESITE=lax
      - OAUTH2_PROXY_WHITELIST_DOMAINS=guest.zoci.me
      - OAUTH2_PROXY_UPSTREAMS=static://200
    volumes:
      - ./oauth2-proxy/emails.txt:/etc/oauth2-proxy/emails.txt:ro

  victoria-metrics:
    # Time-series store for the admin dashboard (spec §2): PromQL-compatible, 6 months raw
    # retention, no downsampling. Reachable exactly two ways: over the `metrics` bridge (Grafana
    # reads it) and on host loopback 127.0.0.1:8428 (the host-side verdict evaluator queries it).
    # Never bound to the tailnet or LAN: its HTTP API is unauthenticated and can delete series,
    # so a routable bind would let any peer (including the semi-trusted VPS) wipe the store.
    image: victoriametrics/victoria-metrics:v1.148.0@sha256:407013e902f9a0ba1d4b2d4c077c47bbaf917c893c52ff39b19efe83a654afda
    restart: unless-stopped
    logging: *default-logging
    command:
      - "-retentionPeriod=6"
      - "-promscrape.config=/etc/vm/scrape.yml"
      # Re-read scrape.yml periodically. Note: scrape.yml is a single-file bind mount, so an
      # editor that replaces the inode is not seen until the container is recreated (same class as
      # the Caddyfile gotcha in infra/CLAUDE.md); recreate victoria-metrics when jobs change.
      - "-promscrape.configCheckInterval=30s"
      - "-storageDataPath=/victoria-metrics-data"
    networks:
      # metrics: serves Grafana's reads and scrapes node-exporter + oauth2-proxy. apiscrape: the
      # dedicated bridge to scrape api:9101 without putting api on the shared metrics plane (see api).
      - metrics
      - apiscrape
    ports:
      - "127.0.0.1:8428:8428"    # loopback only: for the host-side verdict evaluator (§2, Part G)
    volumes:
      - ./metrics/scrape.yml:/etc/vm/scrape.yml:ro
      - vm_data:/victoria-metrics-data
    security_opt:
      - no-new-privileges:true

  node-exporter:
    # Host metrics + the textfile collector's zoci_* series (spec §2/§3). Reads host /proc,/sys,/
    # read-only via --path.* mounts, or it reports its own container namespace instead of the
    # host. Reachable only by VictoriaMetrics over the `metrics` bridge: no published port, no
    # host networking. Non-root (image default `nobody`), read-only rootfs, all caps dropped.
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    restart: unless-stopped
    logging: *default-logging
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.textfile.directory=/textfile"
      # Only the collectors the dashboard reads; keeps the series set small and predictable.
      - "--collector.disable-defaults"
      - "--collector.cpu"
      - "--collector.loadavg"
      - "--collector.meminfo"
      - "--collector.filesystem"
      - "--collector.textfile"
    networks:
      - metrics
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ./metrics/textfile:/textfile:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  admin-web:
    # React/Mantine admin dashboard UI (spec Part D). Its own image so no admin UI code lands in
    # the public `web` bundle; reachable only via the tailnet-gated admin.zoci.me vhost (Part E),
    # never the public site. Static files only, hardened like `web`.
    build:
      context: ..
      dockerfile: app/Dockerfile.admin
    image: zoci-admin-web:latest
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8090:80"    # loopback only: Caddy (host) reaches it on the admin vhost, never LAN
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    # Graphs + history for the admin dashboard (spec §2, Part C). Reads VictoriaMetrics over the
    # `metrics` bridge; reachable only through Caddy on the tailnet (Part E), never host-published.
    # Anonymous Viewer, read-only, login + sign-up disabled: no account exists to reconfigure the
    # datasource toward VM's unauthenticated delete API. Serves under /grafana so the themed admin
    # landing can iframe-embed its panels (allow_embedding on; Caddy adds the frame-ancestors CSP).
    image: grafana/grafana:13.1.1@sha256:7cb8c64c4d57a57e734073f3cc94620adb24a0acb929bd80ba9f14017e3a975b
    restart: unless-stopped
    logging: *default-logging
    networks:
      - metrics
    ports:
      - "127.0.0.1:3000:3000"    # loopback only: host-networked Caddy proxies /grafana here (Part E)
    environment:
      - GF_SERVER_ROOT_URL=https://admin.zoci.me/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_BASIC_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_DEFAULT_THEME=dark
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      - GF_LOG_LEVEL=warn
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    security_opt:
      - no-new-privileges:true

  finance-db:
    # Postgres for the finance dashboard (see ~/specs/finance-dashboard.md). On the internal
    # `finance` bridge only: no host port, never on the LAN or internet, reached solely by the
    # finance backend. Data at rest is not yet encrypted (host full-disk encryption is the intended
    # control; see the spec's at-rest note). Needs FINANCE_DB_PASSWORD in infra/.env; an empty value
    # makes Postgres refuse to initialize (the container restart-loops until it is set).
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    logging: *default-logging
    networks:
      - finance
    environment:
      - POSTGRES_USER=finance
      - POSTGRES_DB=finance
      - POSTGRES_PASSWORD=${FINANCE_DB_PASSWORD}
    volumes:
      - finance_db:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 30s
      timeout: 5s
      retries: 3

  finance:
    # Finance backend (see ~/specs/finance-dashboard.md): the only process holding the Plaid
    # credentials and the Postgres connection, isolated from the internet-facing `api` the way
    # ha-broker isolates the HA token. On the `finance` bridge to reach finance-db; published on host
    # loopback for the tailnet-gated finance.zoci.me vhost only, never the LAN or internet. Serves
    # /health until PLAID_* and FINANCE_TOKEN_KEY are set, then the link + pull routes.
    build:
      context: ../finance
      dockerfile: Dockerfile
    image: zoci-finance:latest
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      finance-db:
        condition: service_healthy
    networks:
      - finance
    ports:
      - "127.0.0.1:9103:9103"
    environment:
      - PLAID_CLIENT_ID=${PLAID_CLIENT_ID:-}
      - PLAID_SECRET=${PLAID_SECRET:-}
      - PLAID_ENV=${PLAID_ENV:-sandbox}
      - PLAID_REDIRECT_URI=${PLAID_REDIRECT_URI:-}
      - FINANCE_TOKEN_KEY=${FINANCE_TOKEN_KEY:-}
      - DATABASE_URL=postgresql://finance:${FINANCE_DB_PASSWORD}@finance-db:5432/finance
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9103/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  finance-web:
    # React/Mantine finance UI (finance.zoci.me). Its own image so no finance UI code lands in the
    # public `web` bundle; reachable only via the tailnet-gated finance.zoci.me vhost, never the
    # public site. Static files only, hardened like `web` and `admin-web`.
    build:
      context: ..
      dockerfile: app/Dockerfile.finance
    image: zoci-finance-web:latest
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8091:80"    # loopback only: Caddy (host) reaches it on the finance vhost, never LAN
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caddy_data:
  caddy_config:
  vm_data:
  grafana_data:
  finance_db:

networks:
  broker:
    driver: bridge
  metrics:
    # Isolated bridge for the metrics plane. VictoriaMetrics + node-exporter live here; Grafana
    # (Part C) joins to read VM, and oauth2-proxy joins so VM can scrape its metrics. Kept separate
    # from `broker` so scraping never widens who can reach ha-broker's control listener (spec §5,
    # ha-broker token isolation).
    driver: bridge
  apiscrape:
    # Dedicated point-to-point bridge for VictoriaMetrics to scrape api's :9101 metrics listener.
    # Exists so api stays off the shared `metrics` bridge: api's :9102 admin-data listener (verdict +
    # access audit, both identity-bearing) binds 0.0.0.0, and this keeps Grafana / oauth2-proxy /
    # node-exporter from reaching it. Only VM (passive) and ha-broker (via `broker`) can, and neither
    # initiates requests to api.
    driver: bridge
  finance:
    # Isolated bridge for the finance data plane: the finance backend and its Postgres, nothing
    # else. Keeps the Plaid-derived data and the database off every other plane.
    driver: bridge
