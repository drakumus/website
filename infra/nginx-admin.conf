server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index admin.html;

    # Single-page admin app: the Vite entry is admin.html, so any route falls back to it.
    location / {
        try_files $uri $uri/ /admin.html;
    }

    # Long-cache hashed assets; never cache the HTML entrypoint.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /admin.html {
        add_header Cache-Control "no-cache";
    }
}
